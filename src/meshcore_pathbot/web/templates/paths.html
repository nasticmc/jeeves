{% extends "base.html" %}
{% block title %}Path Resolver - PathBot{% endblock %}
{% block content %}
<h2>Path Resolver</h2>

<p><small>Enter a raw hex path string to resolve it into repeater names.</small></p>

<form hx-post="/paths/resolve" hx-target="#path-result" hx-swap="innerHTML">
    <fieldset role="group">
        <input
            type="text"
            name="raw_path"
            placeholder="e.g. fb1f7a (hex pairs)"
            pattern="[0-9a-fA-F]*"
            value="{{ raw_path or '' }}"
            required
        >
        <button type="submit">Resolve</button>
    </fieldset>
</form>

<div id="path-result">
    {% if hops is not none %}
    {% include "partials/path_display.html" %}
    {% endif %}
</div>
{% endblock %}
